<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#080d22">
<meta name="description" content="Checkpoint Rush: corrida arcade 3D contra o relógio.">
<title>CHECKPOINT RUSH · FILHOS DE BLANKA</title>

<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#080d22;touch-action:none}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d22;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#game{pointer-events:none;visibility:hidden}#game3d{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:linear-gradient(#142653,#ec7f8d 32%,#f8bb8c 49%,#224455 72%,#102536 100%)}#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 52%,transparent 45%,#0006 110%)}
#speedFX{position:fixed;inset:0;pointer-events:none;opacity:0;
background:repeating-linear-gradient(109deg,transparent 0 15%,#e8ffff36 15.08%,transparent 15.2% 26%);
mask-image:radial-gradient(ellipse at 50% 56%,transparent 32%,#000b 88%);
animation:roadStreaks .58s linear infinite;will-change:opacity,background-position}
@keyframes roadStreaks{to{background-position:-92px 140px}}
@media(max-width:620px){#speedFX{animation-duration:.85s}#hud .hudbox{backdrop-filter:none}}
#hud{position:fixed;inset:0;pointer-events:none;display:none;padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));font-weight:900;text-shadow:0 2px 7px #000b;letter-spacing:1px}
#hud.show{display:block}.topline{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}.hudbox{padding:8px 10px;background:#071329c9;border:1px solid #ffffff30;border-radius:11px;backdrop-filter:blur(7px)}
.hudlabel{font-size:10px;color:#9bebff;letter-spacing:2px}.hudvalue{font-size:clamp(18px,4.5vw,31px);line-height:1.1;font-variant-numeric:tabular-nums}
#timer.urgent{color:#ff605d;animation:pulse .65s infinite alternate}@keyframes pulse{to{opacity:.45}}
.bottomline{position:absolute;left:calc(12px + env(safe-area-inset-left));right:calc(12px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:flex-end;justify-content:space-between}
.hudsmall{font-size:12px}.hudsmall b{font-size:20px}.meter{margin-top:4px;width:125px;height:7px;border-radius:10px;background:#ffffff3d;overflow:hidden}.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,#36f4e8,#c7ff55);transition:width .12s}
#banner{position:fixed;left:50%;top:28%;transform:translateX(-50%);pointer-events:none;text-align:center;font-size:clamp(22px,6vw,56px);font-weight:1000;letter-spacing:2px;text-shadow:0 5px 0 #10122e,0 8px 28px #000;opacity:0;transition:opacity .2s;white-space:nowrap;max-width:98vw}
#banner.show{opacity:1}#banner small{display:block;font-size:.38em;color:#e9faff;letter-spacing:3px}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(180deg,#040918ae,#0409188a 38%,#030716cc);overflow:auto}
.panel{width:min(450px,100%);border:1px solid #ffffff32;border-radius:23px;padding:clamp(20px,5vw,35px);background:linear-gradient(160deg,#10213be9,#090d23f2);box-shadow:0 18px 65px #01030ccc, inset 0 1px 0 #ffffff20;text-align:center}
.eyebrow{font-size:11px;letter-spacing:4px;color:#68f1eb;font-weight:800;margin:0 0 9px}.brand{font-size:clamp(43px,11vw,66px);line-height:.86;font-style:italic;letter-spacing:-3px;font-weight:1000;margin:0;color:#fff;text-shadow:4px 5px 0 #f95070,7px 9px 0 #2d234a}.brand span{color:#6df5e2}
.subtitle{color:#c5d5e9;line-height:1.5;font-size:14px;margin:24px auto 12px;max-width:330px}.result{font-size:clamp(25px,7vw,42px);font-weight:1000;margin:10px 0;color:#fefa9a}
.pills{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:14px 0 22px}.pill{border:1px solid #ffffff40;background:#ffffff16;border-radius:20px;padding:6px 10px;font-size:11px;font-weight:800}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #82ffdd;outline-offset:3px}
.bigbutton{display:block;width:100%;padding:14px 18px;border:0;border-radius:12px;background:linear-gradient(105deg,#eaff66,#5df1d9);color:#0b2232;font-weight:1000;letter-spacing:2px;font-size:16px;box-shadow:0 6px 0 #1f8d9d;touch-action:manipulation}
.bigbutton:active{transform:translateY(4px);box-shadow:0 2px 0 #1f8d9d}.secondary{background:#ffffff1c;color:white;border:1px solid #ffffff3d;box-shadow:none;margin-top:13px;font-size:13px;letter-spacing:1px;padding:10px}
.help{color:#a3bbd0;font-size:11px;line-height:1.55;margin-top:18px}.help strong{color:white}
#pauseBtn,#soundBtn{position:fixed;top:calc(82px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));z-index:2;border:1px solid #ffffff4d;background:#071329c9;color:white;border-radius:10px;padding:9px 12px;font-size:17px;display:none;touch-action:manipulation}
#soundBtn{right:calc(62px + env(safe-area-inset-right))}#pauseBtn.show,#soundBtn.show{display:block}
#mobile{position:fixed;bottom:calc(28px + env(safe-area-inset-bottom));left:0;right:0;display:none;justify-content:space-between;padding:0 22px;pointer-events:none}
.drive{pointer-events:auto;width:min(24vw,86px);height:min(22vw,82px);border-radius:18px;border:2px solid #ffffff8c;background:#0917338c;color:white;font-size:31px;font-weight:900;box-shadow:0 5px 15px #0008;backdrop-filter:blur(7px);touch-action:none}
.drive:active,.drive.pressed{background:#77ffcb88}.controlsLeft{display:flex;gap:12px}.controlsRight{display:flex;gap:12px}.drive.small{font-size:16px;width:min(23vw,78px)}
@media(pointer:coarse){#mobile.show{display:flex}.bottomline{bottom:calc(116px + env(safe-area-inset-bottom))}}
@media(max-width:510px){#mobile{padding:0 9px;gap:8px;bottom:calc(16px + env(safe-area-inset-bottom))}.controlsLeft,.controlsRight{gap:8px}.drive,.drive.small{width:min(18vw,69px);height:min(19vw,72px)}.drive.small{font-size:12px}.bottomline{top:calc(120px + env(safe-area-inset-top));bottom:auto;align-items:flex-start}.bottomline .hudbox{padding:5px 7px}.bottomline .hudsmall b{font-size:15px}.bottomline #lives{font-size:18px!important}.hudbox{padding:6px 7px}.hudlabel{font-size:9px}.hudvalue{font-size:19px}.bottomline{gap:3px}.meter{width:80px}#pauseBtn,#soundBtn{top:calc(75px + env(safe-area-inset-top))}}
@media(max-height:530px){#mobile{bottom:5px}.drive{height:58px;width:66px}#overlay{padding:8px}.panel{padding:15px}.subtitle{margin:9px auto}.pills{margin:7px auto}.help{margin-top:9px}}

#overlay.menu{background:linear-gradient(180deg,#050b1fa1,#0810222a 51%,#060b19dd);align-items:center;justify-content:flex-start}
#overlay.menu .panel{margin-left:max(2vw,10px);background:#07142cdb;border:1px solid #ffefc447;max-width:min(430px,45vw);}
#overlay.menu .brand{font-size:clamp(35px,5vw,67px);letter-spacing:-2px;text-shadow:3px 4px 0 #132435,5px 6px 0 #ff762c}
#overlay.menu .brand span{color:#ffad4c}
#overlay.menu .eyebrow{color:#96efb5}
#overlay.menu .bigbutton{background:linear-gradient(100deg,#ffde65,#fa8f2b);color:#142032;box-shadow:0 6px 0 #9a371e}
#menuCar{display:none;width:min(100%,290px);max-height:170px;object-fit:contain;margin:5px auto 18px}
#overlay:not(.menu) #menuCar{display:none}
#overlay.menu #menuCar{display:block}
#overlay:not(.menu) .subtitle{display:block!important}
#overlay.menu .subtitle,#overlay.menu .pills,#overlay.menu .help,#overlay.menu #secondary{display:none!important}
#overlay.menu .panel{padding:clamp(18px,3vw,28px)}
@media(max-width:700px){#overlay.menu{align-items:flex-end;justify-content:center;padding:14px 12px 18px;background:linear-gradient(180deg,#050b1f10 10%,#050b1f66 55%,#050b1fea 95%)}#overlay.menu .panel{margin:0;max-width:410px;width:100%;padding:16px 22px 20px}#overlay.menu .brand{font-size:clamp(34px,10vw,49px)}#menuCar{max-height:88px;margin:4px auto 8px}}
</style>

function setOverlay(type,html,title,buttonText,showContinue=false){overlay.style.display='flex';panel.querySelector('.eyebrow').textContent=title;panel.querySelector('.brand').innerHTML='CHECKPOINT<br><span>RUSH</span>';panel.querySelector('.subtitle').innerHTML=html;panel.querySelector('.pills').style.display='none';panel.querySelector('.help').style.display='none';el('record').textContent='RECORDE: '+best.toLocaleString('pt-BR')+' PONTOS';primary.textContent=buttonText;secondary.style.display='none';overlay.classList.toggle('menu',type==='menu');hud.classList.toggle('show',type==='pause');pauseBtn.classList.remove('show');soundBtn.classList.remove('show');mobile.classList.remove('show');}
function showMenu(){mode='menu';setOverlay('menu','','FILHOS DE BLANKA APRESENTA','▶ START',false);}
function showPause(){setOverlay('pause','Sua corrida está pausada. Continue de onde parou.','⏸ PAUSA','▶ CONTINUAR',false);}
function showEnd(win){mode=win?'won':'lost';if(player){best=Math.max(best,Math.floor(player.score));if(hasSDK){try{yt.engagement.sendScore({value:best}).catch(()=>{});}catch(e){}}}sessionSaved=null;persist();const msg=win?'<span class="result">🏁 CORRIDA CONCLUÍDA!</span><br>Você concluiu a viagem! Pontuação: <b>'+Math.floor(player.score).toLocaleString('pt-BR')+'</b>.':'<span class="result">FIM DE CORRIDA</span><br>'+ 'O tempo acabou antes do próximo checkpoint. Cada batida custa tempo.'+'<br>Pontuação: <b>'+Math.floor(player.score).toLocaleString('pt-BR')+'</b>.';setOverlay('end',msg,win?'VOCÊ VENCEU!':'TENTE NOVAMENTE','↻ JOGAR NOVAMENTE');beep(win?780:150,.35,'sawtooth',.06);updateEngine();}
function startGame(resume=false){audioStart();releaseKeys();if(resume&&sessionSaved){player={...sessionSaved.player};objects=(sessionSaved.objects||[]).map(o=>({...o}));nextSpawn=sessionSaved.nextSpawn||player.distance+220;stageIndex=sessionSaved.stageIndex||0;sessionSaved=null;}else{player={distance:0,speed:95,lateral:0,steerVelocity:0,crashes:0,time:40,score:0,nitro:0,invincible:0,slow:0,drift:0};objects=[];nextSpawn=110;stageIndex=0;sessionSaved=null;fillTraffic();}mode='running';overlay.style.display='none';hud.classList.add('show');pauseBtn.classList.add('show');soundBtn.classList.add('show');mobile.classList.add('show');lastTime=performance.now();musicTick=0;updateHUD();setToast('ETAPA '+(stageIndex+1)+' · '+STAGES[stageIndex].name,.9);updateEngine();}
function togglePause(){if(hostPaused)return;if(mode==='running'){mode='paused';manualPaused=true;releaseKeys();persist();showPause();}else if(mode==='paused'){mode='running';manualPaused=false;overlay.style.display='none';hud.classList.add('show');pauseBtn.classList.add('show');soundBtn.classList.add('show');mobile.classList.add('show');lastTime=performance.now();}}
function releaseKeys(){for(let k in keys)keys[k]=false;document.querySelectorAll('.drive').forEach(b=>b.classList.remove('pressed'));screenDrag=null;}
function setToast(text,duration=1.8,detail=''){banner.innerHTML=text+(detail?'<small>'+detail+'</small>':'');banner.classList.add('show');toastTimer=duration;}
function lanePick(){return [-.76,0,.76][Math.floor(Math.random()*3)];}
function fillTraffic(){
 while(nextSpawn<player.distance+VIEW+250){
  const distance=nextSpawn;
  const possible=['car','car','car','car','van','cone','barrel','barrier','tires','crate'];
  const type=possible[Math.floor(Math.random()*possible.length)],lane=lanePick();
  const fleet=type==='van'?TRAFFIC_FLEET[5]:TRAFFIC_FLEET[Math.floor(Math.random()*5)];
  objects.push({distance,lane,type,model:fleet.id,velocity:type==='car'?rand(32,62):type==='van'?rand(24,44):0,
    color:fleet.paint,hit:false,passed:false,phase:rand(0,6)});
  nextSpawn+=rand(130,215)/(1+stageIndex*.24);
 }
}
const lerp2=(a,b,t)=>a+(b-a)*t;
function curveAt(d){return Math.sin(d/740)*.85+Math.sin(d/310)*.28+Math.sin(d/1550)*.38;}
function geom(depth){const b=Math.pow(clamp(depth,0,1),1.32);const half=lerp(9,Math.min(W*.465,H*.82),b);const bend=(curveAt(player?player.distance+VIEW*(1-depth):VIEW*(1-depth))-curveAt(player?player.distance:0))*W*.145*(1-depth);const center=W/2+bend;return{center,half,y:H*.34+(H*(W/H<.7?.49:.58))*Math.pow(depth,1.64)};}
function project(obj){const ahead=obj.distance-player.distance,depth=1-ahead/VIEW;if(depth<0||depth>1.18)return null;const g=geom(Math.min(1,depth));return{x:g.center+obj.lane*g.half*.78,y:g.y,scale:.15+depth*.85,depth,ahead};}
function collide(o){if(player.invincible>0||o.hit)return;if(Math.abs(o.lane-player.lateral)>.40||o.distance-player.distance>6||o.distance-player.distance < -6)return;o.hit=true;player.invincible=1.10;player.crashes++;player.slow=1.25;player.speed=25;player.nitro=Math.max(0,player.nitro-18);flash=.62;beep(95,.24,'sawtooth',.085);setToast('BATIDA!',.8,'VOCÊ PERDEU VELOCIDADE');}
function checkpoint(){if(stageIndex<2){stageIndex++;player.time=43;player.crashes=0;player.score+=750;player.nitro=clamp(player.nitro+25,0,100);setToast('CHECKPOINT! +TEMPO',2,'ETAPA '+(stageIndex+1)+' · '+STAGES[stageIndex].name);beep(780,.18,'triangle');setTimeout(()=>beep(1040,.22,'triangle'),120);persist();}else{player.score+=1500+Math.floor(player.time*25)+Math.floor(player.time)*30;showEnd(true);}}
function update(dt){sceneTime+=dt;frame++;if(mode!=='running'||hostPaused)return;player.invincible=Math.max(0,player.invincible-dt);player.slow=Math.max(0,(player.slow||0)-dt);flash=Math.max(0,flash-dt*1.5);toastTimer-=dt;if(toastTimer<=0)banner.classList.remove('show');
const steer=(keys.right?1:0)-(keys.left?1:0);const beforeBend=trackX(player.distance);player.steerVelocity=lerp(player.steerVelocity||0,steer,1-Math.exp(-dt*9));player.lateral=clamp(player.lateral+player.steerVelocity*dt*(.98+player.speed/230*.58),-1.12,1.12);const outside=Math.abs(player.lateral)>1.00;
const usingNitro=keys.nitro&&player.nitro>0&&!keys.brake;const maxSpeed=player.slow>0?25:usingNitro?270:outside?130:keys.brake?85:215;player.speed+=clamp(maxSpeed-player.speed,-(keys.brake?240:105)*dt, (usingNitro?180:90)*dt);player.speed=clamp(player.speed,40,295);if(usingNitro)player.nitro=Math.max(0,player.nitro-dt*33);if(outside)player.score=Math.max(0,player.score-dt*8);
const delta=player.speed*dt*.23;player.distance+=delta;player.lateral=clamp(player.lateral-(trackX(player.distance)-beforeBend)/6.25*.55,-1.12,1.12);player.time=Math.max(0,player.time-dt);player.score+=delta*(usingNitro?.65:.28);if(player.time<=0){showEnd(false);return;}
for(const o of objects){if(o.passed)continue;if(o.velocity)o.distance+=o.velocity*dt*.23;collide(o);if(mode!=='running')return;if(o.distance<player.distance-38){o.passed=true;if(!o.hit){player.score+=42;const close=Math.abs(o.lane-player.lateral);if(close<.62&&close>.40){player.nitro=clamp(player.nitro+17,0,100);player.score+=110;setToast('QUASE!',.55,'+110 PONTOS · +17 NITRO');beep(650,.09,'sine',.03);}}}}
objects=objects.filter(o=>o.distance>player.distance-145);fillTraffic();if(player.distance>=STAGES[stageIndex].end){checkpoint();if(mode!=='running')return;}if(musicTick>0)musicTick-=dt;else if(player.speed>160){musicTick=rand(1.6,2.6);}
updateHUD();}
function updateHUD(){if(!player)return;el('stage').textContent=String(stageIndex+1).padStart(2,'0')+' / 03';el('region').textContent=STAGES[stageIndex].name;el('timer').textContent=player.time.toFixed(1);el('timer').classList.toggle('urgent',player.time<10);el('speed').textContent=Math.round(player.speed);el('lives').textContent=String(player.crashes||0);el('score').textContent=Math.floor(player.score).toLocaleString('pt-BR');el('nitro').textContent='NITRO '+Math.floor(player.nitro)+'%';const prev=stageIndex?STAGES[stageIndex-1].end:0,next=STAGES[stageIndex].end;el('remaining').textContent=(Math.max(0,next-player.distance)/1000).toFixed(2);el('progress').style.width=(clamp((player.distance-prev)/(next-prev),0,1)*100).toFixed(1)+'%';}
function poly(points,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fill();}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function line(x1,y1,x2,y2,color,w=2){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function sky(st){const gr=ctx.createLinearGradient(0,0,0,H*.7);st.sky.forEach((c,i)=>gr.addColorStop(i/(st.sky.length-1),c));ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
const sunX=W*(stageIndex===2?.77:.75),sunY=H*.21,rad=Math.min(W,H)*.095;ctx.fillStyle=stageIndex===2?'#f98ab9':'#ffe2a3';ctx.shadowColor=stageIndex===2?'#ff78f7':'#fbb372';ctx.shadowBlur=35;ctx.beginPath();ctx.arc(sunX,sunY,rad,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
for(let layer=0;layer<3;layer++){const y=H*(.31+layer*.07),amp=H*(.05+layer*.017),period=W*(.22+layer*.04),phase=player?player.distance*.0003*(layer+1):sceneTime*.05;ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,y);for(let x=0;x<=W+8;x+=9){let yy=y+Math.sin(x/period*6.28+phase)*amp*.35+Math.cos(x/period*3.2+layer)*amp*.8;ctx.lineTo(x,yy);}ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=layer===0?st.mount:layer===1?st.hill:st.grass[0];ctx.fill();}
if(stageIndex===2){ctx.fillStyle='#192449';for(let i=0;i<32;i++){const bw=W/27,bx=(i*W/27-player.distance*.015%(W+40)+W+40)%(W+40)-20,bh=H*(.05+(Math.sin(i*77)*.5+.5)*.16);ctx.fillRect(bx,H*.36-bh,bw*.9,bh);ctx.fillStyle='#ffdca388';for(let q=0;q<3;q++)for(let t=0;t<5;t++)if((i+q+t)%3!==0)ctx.fillRect(bx+4+q*bw*.23,H*.36-bh+6+t*bh/6,2,3);ctx.fillStyle='#192449';}}
}
function renderRoad(st){if(W/H<.7){const a=geom(1),endHalf=a.half*1.34;poly([[a.center-a.half*1.10,a.y],[a.center+a.half*1.10,a.y],[a.center+endHalf*1.10,H],[a.center-endHalf*1.10,H]],'#eff2f5');poly([[a.center-a.half,a.y],[a.center+a.half,a.y],[a.center+endHalf,H],[a.center-endHalf,H]],st.road);}const strips=46;for(let i=0;i<strips;i++){const d0=i/strips,d1=(i+1)/strips,a=geom(d0),b=geom(d1);const colorIndex=Math.floor((player?player.distance:0)/85+(1-d0)*VIEW/85)%2;poly([[0,a.y],[W,a.y],[W,b.y],[0,b.y]],st.grass[colorIndex]);poly([[a.center-a.half*1.09,a.y],[a.center+a.half*1.09,a.y],[b.center+b.half*1.09,b.y],[b.center-b.half*1.09,b.y]],colorIndex?'#efeef0':'#f05c74');poly([[a.center-a.half,a.y],[a.center+a.half,a.y],[b.center+b.half,b.y],[b.center-b.half,b.y]],st.road);
let stripe=Math.floor(((player?player.distance:0)+VIEW*(1-d0))/80)%2;if(stripe===0){for(const lane of [-1/3,1/3]){let xx0=a.center+a.half*lane,xx1=b.center+b.half*lane;poly([[xx0-Math.max(1,a.half*.008),a.y],[xx0+Math.max(1,a.half*.008),a.y],[xx1+Math.max(1,b.half*.008),b.y],[xx1-Math.max(1,b.half*.008),b.y]],'#fff5d3');}}}
}
function palm(x,y,s,flip=1){ctx.save();ctx.translate(x,y);ctx.scale(s*flip,s);ctx.strokeStyle='#543e4a';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-3,-22,6,-54);ctx.stroke();for(let i=0;i<6;i++){let a=(i/6)*Math.PI*2;ctx.fillStyle=i%2?'#1f7b73':'#35a582';ctx.beginPath();ctx.moveTo(6,-54);ctx.quadraticCurveTo(6+Math.cos(a)*28,-60+Math.sin(a)*13,6+Math.cos(a)*47,-46+Math.sin(a)*21);ctx.quadraticCurveTo(6+Math.cos(a)*17,-65+Math.sin(a)*16,6,-54);ctx.fill();}ctx.restore();}
function decor(){const st=STAGES[stageIndex];const start=Math.floor((player?player.distance:0)/110)*110;const list=[];for(let d=start;d<(player?player.distance:0)+VIEW;d+=110){const depth=1-(d-(player?player.distance:0))/VIEW;if(depth<0||depth>1)continue;const g=geom(depth);list.push({depth,g,dir:Math.sin(d*.035)>0?1:-1,d});}list.sort((a,b)=>a.depth-b.depth);for(const e of list){const x=e.g.center+e.dir*e.g.half*(1.3+.17*Math.sin(e.d)),y=e.g.y,s=(.14+e.depth*1.9)*Math.min(W,H)/510;if(stageIndex===0)palm(x,y,s,e.dir);else if(stageIndex===1){poly([[x-14*s,y],[x,y-68*s],[x+14*s,y]],'#153f45');poly([[x-12*s,y-20*s],[x,y-84*s],[x+12*s,y-20*s]],'#22755f');rounded(x-2*s,y-18*s,4*s,18*s,1,'#554047');}else{rounded(x-2*s,y-68*s,4*s,68*s,1,'#39456d');rounded(x-6*s,y-69*s,12*s,4*s,2,st.accent);ctx.fillStyle=st.accent;ctx.shadowColor=st.accent;ctx.shadowBlur=12*s;ctx.fillRect(x-5*s,y-68*s,10*s,2*s);ctx.shadowBlur=0;}}}
function carShape(x,y,s,color,enemy=false,van=false,blink=false){const base=Math.min(W,H)/600;const w=(van?67:59)*s*base,h=(van?108:94)*s*base;ctx.save();ctx.translate(x,y);if(!enemy&&player&&player.invincible>0&&Math.floor(sceneTime*12)%2===0)ctx.globalAlpha=.45;
ctx.fillStyle='#050a1b73';ctx.beginPath();ctx.ellipse(0,h*.02,w*.69,h*.20,0,0,Math.PI*2);ctx.fill();rounded(-w*.57,-h*.43,w*.16,h*.33,w*.04,'#10121f');rounded(w*.41,-h*.43,w*.16,h*.33,w*.04,'#10121f');
ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-w*.38,-h*.92);ctx.lineTo(w*.38,-h*.92);ctx.quadraticCurveTo(w*.48,-h*.9,w*.5,-h*.79);ctx.lineTo(w*.47,-h*.16);ctx.quadraticCurveTo(w*.46,-h*.04,w*.32,-h*.01);ctx.lineTo(-w*.32,-h*.01);ctx.quadraticCurveTo(-w*.46,-h*.04,-w*.47,-h*.16);ctx.lineTo(-w*.5,-h*.79);ctx.quadraticCurveTo(-w*.48,-h*.9,-w*.38,-h*.92);ctx.closePath();ctx.fill();
poly([[-w*.34,-h*.71],[w*.34,-h*.71],[w*.41,-h*.47],[-w*.41,-h*.47]],'#17354e');poly([[-w*.32,-h*.69],[w*.04,-h*.69],[-w*.06,-h*.48],[-w*.37,-h*.48]],'#73c5d466');poly([[-w*.36,-h*.4],[w*.36,-h*.4],[w*.31,-h*.21],[-w*.31,-h*.21]],'#142c43');line(-w*.24,-h*.91,w*.24,-h*.91,'#ffffff55',w*.028);line(-w*.36,-h*.18,w*.36,-h*.18,'#16152b',w*.034);
rounded(-w*.39,-h*.17,w*.22,h*.11,2,blink?'#ffffff':'#ff547b');rounded(w*.17,-h*.17,w*.22,h*.11,2,blink?'#ffffff':'#ff547b');rounded(-w*.10,-h*.12,w*.20,h*.045,1,'#f6e5bf');ctx.fillStyle='#ffffff3d';ctx.fillRect(-w*.40,-h*.81,w*.07,h*.36);ctx.restore();}
function obstacleShape(o,p){const base=Math.min(W,H)/600,s=p.scale*base;ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='#03061666';ctx.beginPath();ctx.ellipse(0,0,28*s,8*s,0,0,Math.PI*2);ctx.fill();if(o.type==='cone'){poly([[-17*s,0],[0,-52*s],[17*s,0]],'#f27d39');poly([[-11*s,-14*s],[11*s,-14*s],[7*s,-24*s],[-7*s,-24*s]],'#fff0c5');rounded(-22*s,-5*s,44*s,7*s,1,'#2c2f43');}else{rounded(-18*s,-49*s,36*s,48*s,6*s,'#f4873d');rounded(-19*s,-43*s,38*s,7*s,2*s,'#f9df96');rounded(-19*s,-10*s,38*s,7*s,2*s,'#f9df96');ctx.strokeStyle='#dc562f';ctx.lineWidth=3*s;ctx.beginPath();ctx.ellipse(0,-45*s,18*s,5*s,0,0,Math.PI*2);ctx.stroke();}ctx.restore();}
function drawGate(end){const delta=end-player.distance;if(delta<0||delta>VIEW)return;const depth=1-delta/VIEW,g=geom(depth),s=(.18+depth*1.7)*Math.min(W,H)/600;if(depth<.08)return;const half=g.half*1.15,y=g.y;const left=g.center-half,right=g.center+half;rounded(left-5*s,y-105*s,10*s,108*s,1,'#e5efef');rounded(right-5*s,y-105*s,10*s,108*s,1,'#e5efef');rounded(left-5*s,y-108*s,right-left+10*s,27*s,3*s,stageIndex===2?'#ff65bc':'#43ecd9');ctx.font=`900 ${Math.max(7,16*s)}px system-ui`;ctx.textAlign='center';ctx.fillStyle='#101833';ctx.fillText(stageIndex===2?'FINISH':'CHECKPOINT',g.center,y-88*s);}
function renderPlayer(){if(!player)return;const isPortrait=W/H<.7,g=geom(isPortrait?.97:.91),x=g.center+player.lateral*g.half*.78,y=H*(isPortrait?.82:.875),s=clamp(Math.min(W/600,H/600),.50,1.45);if(keys.nitro&&player.nitro>0&&mode==='running'){ctx.fillStyle='#fff0a8';poly([[x-17*s,y-1*s],[x-8*s,y+rand(15,35)*s],[x-1*s,y-1*s]],'#ffc956');poly([[x+1*s,y-1*s],[x+8*s,y+rand(15,35)*s],[x+17*s,y-1*s]],'#72faff');}carShape(x,y,1.2*600/Math.min(W,H)*s*1.2,'#fce568',false,false,keys.brake);}
function drawFallback2D(){const st=STAGES[stageIndex];ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);sky(st);renderRoad(st);decor();if(player){drawGate(STAGES[stageIndex].end);const visible=[];for(const o of objects){if(o.passed)continue;const p=project(o);if(p)visible.push({o,p});}visible.sort((a,b)=>a.p.depth-b.p.depth);for(const {o,p} of visible){if(o.type==='cone'||o.type==='barrel')obstacleShape(o,p);else carShape(p.x,p.y,p.scale*1.05,o.color,true,o.type==='van');}renderPlayer();if(flash>0){ctx.fillStyle='rgba(255,80,90,'+(.18*flash)+')';ctx.fillRect(0,0,W,H);}}
else{const g=geom(.92),x=g.center,y=H*.91;carShape(x,y,1.4,'#fce568');}
}
function draw(){if(gl3)draw3D();else drawFallback2D();}
function loop(now){const dt=Math.min(.035,Math.max(0,(now-lastTime)/1000||0));lastTime=now;update(dt);draw();updateEngine();requestAnimationFrame(loop);}
primary.addEventListener('click',()=>{if(mode==='paused')togglePause();else startGame(false);});secondary.addEventListener('click',()=>startGame(true));pauseBtn.addEventListener('click',togglePause);soundBtn.addEventListener('click',()=>{soundEnabled=!soundEnabled;updateSoundButton();if(soundEnabled)audioStart();updateEngine();});
const keymap={'ArrowLeft':'left','KeyA':'left','ArrowRight':'right','KeyD':'right','ArrowDown':'brake','KeyS':'brake','Space':'nitro'};
window.addEventListener('keydown',e=>{if(e.code==='Escape'||e.code==='KeyP'){if(!e.repeat)togglePause();e.preventDefault();return;}if(e.code==='Enter'&&mode==='menu'){startGame(false);e.preventDefault();return;}const k=keymap[e.code];if(k){keys[k]=true;e.preventDefault();}},{passive:false});window.addEventListener('keyup',e=>{const k=keymap[e.code];if(k){keys[k]=false;e.preventDefault();}},{passive:false});window.addEventListener('blur',()=>{if(mode==='running')togglePause();releaseKeys();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='running')togglePause();});
for(const b of document.querySelectorAll('.drive')){const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true;b.classList.add('pressed');});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,e=>{keys[k]=false;b.classList.remove('pressed');});}
canvas3d.addEventListener('pointerdown',e=>{if(mode!=='running'||e.pointerType==='mouse')return;screenDrag={id:e.pointerId,x:e.clientX,initial:player.lateral};canvas3d.setPointerCapture(e.pointerId);});canvas3d.addEventListener('pointermove',e=>{if(!screenDrag||screenDrag.id!==e.pointerId||!player)return;const diff=(e.clientX-screenDrag.x)/Math.max(130,W*.32);player.lateral=clamp(screenDrag.initial+diff,-1.1,1.1);});for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas3d.addEventListener(event,e=>{if(screenDrag&&screenDrag.id===e.pointerId)screenDrag=null;});
init3D();boot();
})();
</script></body></html>
